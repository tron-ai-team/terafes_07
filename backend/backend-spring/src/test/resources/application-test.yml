spring:
  datasource:
    url: jdbc:h2:mem:tron_ai_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
      enabled: true

  rabbitmq:
    listener:
      simple:
        auto-startup: false

jwt:
  secret: test-secret-key-at-least-256-bits-long-32-bytes-testing
  access-minutes: 15
  refresh-days: 7

ollama:
  base-url: http://127.0.0.1:11434
  model: qwen3:8b
  timeout-seconds: 5

tron:
  default-model: qwen3-8b
  # CI/GitHub Actions has no live Ollama. Keep local route deterministic so tests that
  # mock AiProvider exercise the real Chat/Voice path without cloud provider keys.
  hybrid:
    assume-local-healthy: true

stt:
  base-url: http://127.0.0.1:8091
  timeout-seconds: 5
  prefer-local: true
  groq-enabled: true
  groq-model: whisper-large-v3-turbo
  groq-timeout-seconds: 5

tts:
  groq:
    enabled: true
    model-english: canopylabs/orpheus-v1-english
    voice-english: autumn
    timeout-seconds: 5
    max-input-chars: 200

voicevox:
  base-url: http://127.0.0.1:50021
  speaker-id: 13
  timeout-seconds: 5
  audio-ttl-seconds: 600
  max-stored-clips: 20
