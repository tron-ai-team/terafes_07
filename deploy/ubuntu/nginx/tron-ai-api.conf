# LEGACY: API-only vhost (earlier Vercel-frontend assumption).
# Preferred self-hosted site (React + API same origin): ../../nginx/tron-ai.conf
# Public API only. Cloudflare connects to Nginx. Nginx connects to Spring on loopback.
# Do not add listeners for MySQL, MinIO, RabbitMQ, Ollama, STT, or VOICEVOX.

upstream tron_ai_core {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 15m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Local model calls can take several minutes.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://tron_ai_core;
    }
}
