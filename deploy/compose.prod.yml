# TRON AI — isolated production Compose stack for the Ubuntu core server.
#
# Services: Spring Boot backend + dedicated MySQL + Gotenberg
# Does NOT touch host MySQL, existing systemd apps (8080–8082), Nginx, or Cloudflare.
#
# Usage (on Ubuntu, from /opt/tron-ai/deploy):
#   docker compose --project-name tron-ai --env-file /etc/tron-ai/tron-ai.env -f compose.prod.yml config
#   docker compose --project-name tron-ai --env-file /etc/tron-ai/tron-ai.env -f compose.prod.yml pull
#   docker compose --project-name tron-ai --env-file /etc/tron-ai/tron-ai.env -f compose.prod.yml up -d
#
# Never publish MySQL or Gotenberg to 0.0.0.0.
# Backend is loopback-only: 127.0.0.1:18080 → container :8080

name: tron-ai

services:
  mysql:
    image: mysql:8.4
    container_name: tron-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tron_ai}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max-connections=50
      - --innodb-buffer-pool-size=256M
    # No host ports — reachable only on tron_ai_internal as hostname "mysql"
    volumes:
      - tron_ai_mysql_data:/var/lib/mysql
    networks:
      - tron_ai_internal
    mem_limit: ${TRON_MYSQL_MEM_LIMIT:-768m}
    cpus: ${TRON_MYSQL_CPUS:-0.75}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tron-ai-gotenberg
    restart: unless-stopped
    # LibreOffice PDF path only — disable Chromium routes to save RAM.
    command:
      - "gotenberg"
      - "--api-timeout=120s"
      - "--libreoffice-restart-after=10"
      - "--libreoffice-max-queue-size=2"
      - "--chromium-disable-routes=true"
    # No host ports: reachable only on tron_ai_internal as http://gotenberg:3000
    networks:
      - tron_ai_internal
    mem_limit: ${TRON_GOTENBERG_MEM_LIMIT:-1024m}
    cpus: ${TRON_GOTENBERG_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${TRON_BACKEND_IMAGE:-ghcr.io/tron-ai-team/terafes_07/tron-ai-backend:latest}
    container_name: tron-ai-backend
    restart: unless-stopped
    env_file:
      # On Ubuntu: /etc/tron-ai/tron-ai.env (chmod 640). required=false so `compose config` works offline.
      - path: ${TRON_ENV_FILE:-/etc/tron-ai/tron-ai.env}
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      # Dedicated Compose MySQL (not host MySQL).
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tron_ai}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOTENBERG_URL: http://gotenberg:3000
      TRON_PDF_ENGINE: gotenberg
      TRON_PDF_ALLOW_LOCAL_LIBREOFFICE: "false"
      TRON_STORAGE_LOCAL_PATH: /var/lib/tron-ai/object-storage
      TRON_RABBITMQ_ENABLED: ${TRON_RABBITMQ_ENABLED:-false}
      RABBITMQ_LISTENER_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      # RTX Tailscale Serve (optional). App also supports OLLAMA_CONNECT_IP without extra_hosts.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_CONNECT_IP: ${OLLAMA_CONNECT_IP:-}
      OLLAMA_TLS_SERVER_NAME: ${OLLAMA_TLS_SERVER_NAME:-}
      OLLAMA_OVERRIDE_HOST: ${OLLAMA_OVERRIDE_HOST:-}
      TRON_AI_RTX_SMART_MODE: ${TRON_AI_RTX_SMART_MODE:-false}
      TRON_AI_RTX_SMART_MODEL: ${TRON_AI_RTX_SMART_MODEL:-qwen3.5:9b-q4_K_M}
      TRON_AI_GTX_FAST_MODE: ${TRON_AI_GTX_FAST_MODE:-false}
    ports:
      # Loopback only — Nginx on the host is the public entry.
      # Conflicts avoided with nijotours:8080, techtitans:8081, ttcomputers:8082.
      - "127.0.0.1:${TRON_BACKEND_HOST_PORT:-18080}:8080"
    # Belt-and-suspenders DNS for MagicDNS inside the bridge network.
    # Empty OLLAMA_TLS_SERVER_NAME / OLLAMA_CONNECT_IP skips useful mapping — set both for RTX.
    extra_hosts:
      - "${OLLAMA_TLS_SERVER_NAME:-rtx-ollama.invalid}:${OLLAMA_CONNECT_IP:-127.0.0.1}"
    volumes:
      - tron_ai_object_storage:/var/lib/tron-ai/object-storage
      - tron_ai_uploads:/var/lib/tron-ai/uploads
      - tron_ai_logs:/var/log/tron-ai
    networks:
      - tron_ai_internal
    depends_on:
      mysql:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    mem_limit: ${TRON_BACKEND_MEM_LIMIT:-1280m}
    cpus: ${TRON_BACKEND_CPUS:-1.5}
    # Liveness uses Actuator (DB-backed). Diagnostic /health may report AI as degraded.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  tron_ai_internal:
    name: tron_ai_internal
    driver: bridge

volumes:
  tron_ai_mysql_data:
    name: tron_ai_mysql_data
  tron_ai_object_storage:
    name: tron_ai_object_storage
  tron_ai_uploads:
    name: tron_ai_uploads
  tron_ai_logs:
    name: tron_ai_logs
