# Disposable fixture for the installed dedicated-container topology; never install this on Ubuntu.
name: tron-ai
services:
  mysql:
    image: mysql:8.4
    container_name: tron-ai-mysql
    environment:
      MYSQL_DATABASE: tron_ai
      MYSQL_USER: tron_ci
      MYSQL_PASSWORD: disposable-db-password
      MYSQL_ROOT_PASSWORD: disposable-root-password
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-utron_ci", "--password=disposable-db-password", "tron_ai", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 45
    volumes:
      - db:/var/lib/mysql
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tron-ai-gotenberg
    command: ["gotenberg", "--chromium-disable-routes=true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 45
  backend:
    image: tron-ai-backend:ci
    container_name: tron-ai-backend
    depends_on:
      mysql:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USERNAME: tron_ci
      DB_PASSWORD: disposable-db-password
      JWT_SECRET: disposable-ci-jwt-secret-longer-than-32-characters
      CORS_ALLOWED_ORIGINS: https://example.invalid
      TRON_FRONTEND_URL: https://example.invalid
      TRON_PUBLIC_API_URL: https://api.example.invalid
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      GOTENBERG_URL: http://gotenberg:3000
      TRON_RABBITMQ_ENABLED: "false"
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 4s
      retries: 45
    volumes:
      - storage:/var/lib/tron-ai/object-storage
volumes:
  db: {}
  storage: {}
