# Example Cloudflare Tunnel ingress fragment for TRON AI.
# Merge into the EXISTING tunnel config — do not replace other hostnames.
# Do not commit tunnel tokens or credentials.json.
# Do not apply until DNS cutover is approved.

# tunnel: <existing-tunnel-id-or-name>
# credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Keep all existing project hostnames above these entries.
  - hostname: traonai.tech
    service: http://127.0.0.1:80
  - hostname: www.traonai.tech
    service: http://127.0.0.1:80
  - hostname: api.traonai.tech
    service: http://127.0.0.1:80
  # Catch-all must remain last in the full config:
  # - service: http_status:404
