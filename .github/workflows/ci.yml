# TRON AI — continuous integration (no production deploy).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Production build (same-origin API)
        env:
          VITE_CORE_API_URL: ""
          VITE_LEGACY_API_URL: ""
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit / integration tests
        # Exclude Desktop Agent *Live* tests that require a local OpenCode/desktop runtime.
        # Those remain manual / local verification; CI gates on the hermetic suite.
        run: >
          ./mvnw -B test
          -Dtest='!DesktopAgentControlLiveTest,!DesktopAgentLiveE2ETest,!DesktopAgentThreadLiveTest,!GotenbergLiveConvertIT,!Mission09LiveProviderVerificationIT,!CareerCenterV1BuilderIT,!CareerCenterJourneyIT,!CareerCenterCp03CvBuilderIT'
      - name: Package
        run: ./mvnw -B -DskipTests package

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed secrets (heuristic)
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)credentials\.json$|(^|/)id_rsa$|\.pem$'; then
            echo "Refusing tracked secret-like files."
            exit 1
          fi
          echo "No tracked .env / credentials.json / pem keys found."
      - name: Dependency review (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true

  docker:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/backend-spring
          file: backend/backend-spring/Dockerfile
          push: false
          tags: tron-ai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production compose
        run: |
          set -euo pipefail
          cat > /tmp/tron-ai.ci.env <<'EOF'
          TRON_BACKEND_IMAGE=tron-ai-backend:ci
          DB_USERNAME=tronai
          DB_PASSWORD=ci-only-not-for-production
          MYSQL_ROOT_PASSWORD=ci-only-root-not-for-production
          JWT_SECRET=ci-only-jwt-secret-must-be-32chars-min
          CORS_ALLOWED_ORIGINS=https://traonai.tech
          TRON_FRONTEND_URL=https://traonai.tech
          TRON_PUBLIC_API_URL=https://api.traonai.tech
          EOF
          docker compose --project-name tron-ai --env-file /tmp/tron-ai.ci.env -f deploy/compose.prod.yml config >/dev/null
          echo "compose.prod.yml is valid"
