# Production deploy — DISABLED for automatic runs until Ubuntu setup is verified.
# Re-enable the `push: branches: [main]` trigger only after Codex completes
# server inspection, first manual deploy, and owner approval.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional existing image ref (skip rebuild)"
        required: false
        default: ""
      confirm:
        description: "Type deploy-production to confirm manual run"
        required: true
        default: ""
      ubuntu_ready:
        description: "Type UBUNTU_READY after server config is verified"
        required: true
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: tron-ai-backend

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block until Ubuntu ready
        run: |
          if [ "${{ github.event.inputs.ubuntu_ready }}" != "UBUNTU_READY" ]; then
            echo "Production deploy is gated until Ubuntu Server configuration is complete."
            echo "Pass ubuntu_ready=UBUNTU_READY and confirm=deploy-production only after verification."
            exit 1
          fi
          if [ "${{ github.event.inputs.confirm }}" != "deploy-production" ]; then
            echo "Manual production deploy requires confirm=deploy-production"
            exit 1
          fi

  test:
    needs: [guard]
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build push GHCR + frontend
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.final.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          BASE="ghcr.io/${REPO_LC}/${IMAGE_NAME}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${BASE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        if: ${{ github.event.inputs.image_tag == '' || github.event.inputs.image_tag == null }}
        uses: docker/build-push-action@v6
        with:
          context: backend/backend-spring
          file: backend/backend-spring/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_image }}
            ${{ steps.meta.outputs.base }}:production
            ${{ steps.meta.outputs.base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve image ref
        id: final
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ steps.meta.outputs.sha_image }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_CORE_API_URL: ""
          VITE_LEGACY_API_URL: ""
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          tar -czf "$GITHUB_WORKSPACE/frontend-dist.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-tgz
          path: frontend-dist.tar.gz
          retention-days: 14

  deploy:
    name: SSH deploy production
    needs: [build-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-tgz
      - name: Upload frontend archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          source: frontend-dist.tar.gz
          target: /tmp/
          overwrite: true
      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi
            /opt/tron-ai/deploy/scripts/deploy-release.sh "$IMAGE" /tmp/frontend-dist.tar.gz
            /opt/tron-ai/deploy/scripts/healthcheck.sh
