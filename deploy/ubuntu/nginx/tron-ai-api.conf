# API-only vhost for api.traonai.tech (SPA may live on traonai.tech separately).
# Preferred same-origin site: ../../nginx/tron-ai.conf
#
# Install as a NEW site only — never overwrite nijotours / techtitans / ttcomputers.
# Cloudflare Tunnel can point api.traonai.tech → http://127.0.0.1:80 after approval.
#
# Do NOT enable until DNS/Cloudflare cutover is approved.

upstream tron_ai_core {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.traonai.tech;

    client_max_body_size 15m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://tron_ai_core;
    }
}
