<script>
/*
  Owner/Cursor integration contract:
    window.renderTronRirekisho({
      templateCode: 'RIREKISHO_JA',
      nameJa: '...', furigana: '...', dateOfBirth: '2002-12-02',
      postalCode: '...', addressText: '...', phone: '...', email: '...',
      education: [{schoolName:'...', startYear:2024, startMonth:4,
                   endYear:2026, endMonth:3, status:'graduated'}],
      work: [], certifications: [], selfPr: '...',
      photoDataUri: 'data:image/jpeg;base64,...'
    });

  This is a geometry reference template for Cursor to integrate with validated
  Spring Boot DTOs. AI controls wording ONLY, never positions and CSS.
*/
(function(){
  const q = (selector, root=document) => root.querySelector(selector);
  const fields = [...document.querySelectorAll('[data-field]')];
  const safe = v => v == null ? '' : String(v);
  function setField(key, value) {
    for (const element of fields.filter(e => e.dataset.field === key)) element.textContent = safe(value);
  }
  const fmt = v => v === undefined || v === null || v === '' ? '' : String(v);
  const cleanPostal = v => safe(v).replace(/[^0-9]/g,'').slice(0,7);
  const formattedPostal = v => { const s=cleanPostal(v); return s.length===7 ? s.slice(0,3)+'-'+s.slice(3) : s; };
  function parseIsoDate(v){
    const m=safe(v).trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
    if (!m) return null;
    const [y,mo,d]=[+m[1],+m[2],+m[3]];
    const x=new Date(Date.UTC(y,mo-1,d));
    if(x.getUTCFullYear()!==y||x.getUTCMonth()!==mo-1||x.getUTCDate()!==d) return null;
    return {y,m:mo,d};
  }
  function wareki(x){
    if(!x)return '';
    const n=x.y*10000+x.m*100+x.d;
    let era, yr;
    if(n>=20190501){era='令和';yr=x.y-2018;}
    else if(n>=19890108){era='平成';yr=x.y-1988;}
    else if(n>=19261225){era='昭和';yr=x.y-1925;}
    else return `${x.y}年${x.m}月${x.d}日`;
    return `${era}${yr===1?'元':yr}年${x.m}月${x.d}日`;
  }
  function ageAt(d,asOf){
    if (!d||!asOf) return '';
    return asOf.y-d.y-((asOf.m*100+asOf.d)<(d.m*100+d.d)?1:0);
  }
  function rowStr(r){return safe(r.schoolName||r.school||r.institution||r.name||r.description||'').trim();}
  function asNumberOrBlank(v){return /^\d+$/.test(safe(v)) ? Number(v) : '';}
  function educationEvents(items){
    const out=[];
    for (const item of (Array.isArray(items)?items:[])) {
      if(!item || typeof item!=='object') continue;
      const school=rowStr(item);
      if(!school)continue;
      const startY=asNumberOrBlank(item.startYear||item.admissionYear);
      const startM=asNumberOrBlank(item.startMonth||item.admissionMonth);
      const endY=asNumberOrBlank(item.endYear||item.graduationYear);
      const endM=asNumberOrBlank(item.endMonth||item.graduationMonth);
      const status=safe(item.status||item.graduationStatus).toLowerCase();
      if(startY){out.push({y:startY,m:startM,detail:school+'　入学',source:item});}
      if(endY){const verb=/expected|planned|見込み|予定/.test(status)?'卒業見込み':/studying|enrolled|在学/.test(status)?'在学中':'卒業';out.push({y:endY,m:endM,detail:school+'　'+verb,source:item});}
      if(!startY&&!endY)out.push({y:'',m:'',detail:school+(status?'　'+safe(item.status):''),source:item});
    }
    out.sort((a,b)=>((a.y||9999)*12+(a.m||1))-((b.y||9999)*12+(b.m||1)));
    return out;
  }
  function workEvents(items){
    const out=[];
    for(const item of (Array.isArray(items)?items:[])) {
      if(!item||typeof item!=='object') continue;
      const name=safe(item.company||item.employer||item.name||item.description).trim();
      if(!name)continue;
      out.push({y:asNumberOrBlank(item.startYear||item.year),m:asNumberOrBlank(item.startMonth||item.month),detail:name+(item.action?'　'+safe(item.action):'')});
    }
    return out;
  }
  function putHistory(education,work){
    const e=educationEvents(education), w=workEvents(work);
    const tbody=q('#history-rows'); tbody.replaceChildren();
    const warnings=[];
    if(e.length>9) warnings.push(`Education has ${e.length} timeline events; this reference layout safely holds 9.`);
    if(w.length>2) warnings.push(`Work has ${w.length} entries; this reference layout safely holds 2.`);
    // Static original form rows: header 学歴, 9 school lines, 職歴, 1–2 work lines, 賞罰, 以上.
    const rows=[{detail:'学　歴',kind:'marker'}];
    for(let i=0;i<9;i++) rows.push(e[i]||{});
    rows.push({detail:'職　歴',kind:'marker'});
    const ws=w.length?w.slice(0,2):[{detail:'な　し'}];
    rows.push(...ws);
    rows.push({detail:'賞　罰',kind:'marker'});
    rows.push({detail:'以上',kind:'tail'});
    while(rows.length<15)rows.push({});
    for(const r of rows.slice(0,15)){
      const tr=document.createElement('tr');
      if(r.kind)tr.className=r.kind;
      for (const [k,klass] of [['y','y'],['m','m'],['detail','detail']]) {
        const td=document.createElement('td');td.className=klass;td.textContent=fmt(r[k]);tr.append(td);
      }
      tbody.append(tr);
    }
    return warnings;
  }
  function putCertifications(items){
    const list=Array.isArray(items)?items:[];
    const tbody=q('#certification-rows');tbody.replaceChildren();
    const warnings=list.length>6?[`Certifications has ${list.length} entries; this reference holds 6.`]:[];
    for(let i=0;i<6;i++){
      const c=list[i]||{};
      const tr=document.createElement('tr');
      for(const [v,cls] of [[c.year||c.earnedYear,'y'],[c.month||c.earnedMonth,'m'],[c.name||c.title||c.certification,'detail']]){
        const td=document.createElement('td');td.className=cls;td.textContent=fmt(v);tr.append(td);
      }
      tbody.append(tr);
    }
    return warnings;
  }
  let currentWarnings=[];
  function checkOverflow(){
    document.querySelectorAll('.border-error').forEach(e=>e.classList.remove('border-error'));
    const warnings=[];
    const nodes=document.querySelectorAll('[data-field],.history-table td,.license-table td');
    for(const el of nodes){
      const r=el.getBoundingClientRect();
      if(!el.textContent.trim())continue;
      // Values cannot be hidden/overwritten. Detect and explicitly return errors to integrator.
      if(el.scrollHeight>el.clientHeight+2 || el.scrollWidth>el.clientWidth+2){
        const label=el.dataset.field||el.textContent.slice(0,22);
        warnings.push(`Overflow in ${label}`);el.classList.add('border-error');
      }
    }
    return warnings;
  }
  function render(data={}){
    const asOf=data.asOf === '' ? null : parseIsoDate(data.asOf||new Date().toISOString().slice(0,10));
    const dob=parseIsoDate(data.dateOfBirth);
    const asOfEra=asOf?wareki(asOf):'';
    const yearToken=asOfEra.match(/^令和(元|\d+)年/);
    setField('warekiYear',yearToken?yearToken[1]:'');
    setField('asOfMonth',asOf?.m||'');setField('asOfDay',asOf?.d||'');
    setField('displayName',data.nameJa||data.fullName||'');
    setField('furigana',data.furigana||'');
    setField('birthDateJa',wareki(dob));
    setField('age',ageAt(dob,asOf));
    setField('nationality',data.nationality||'');
    setField('addressFurigana',data.addressFurigana||'');
    let addr=safe(data.addressText||data.address||'').trim();
    let postal=formattedPostal(data.postalCode);
    if(!postal){const m=addr.match(/(?:〒\s*)?(\d{3})[-‐ー\s]?(\d{4})/);if(m){postal=m[1]+'-'+m[2];}}
    addr=addr.replace(/^\s*〒?\s*\d{3}[-‐ー\s]?\d{4}\s*/, '').trim();
    setField('addressBlock',(postal?'〒'+postal:'')+(postal&&addr?'\n':'')+addr);
    setField('phone',data.phone||data.landline||'');
    setField('mobile',data.mobile||data.phone||'');
    setField('email',data.email||'');
    setField('holidayFurigana',data.holidayFurigana||'');
    setField('holidayAddress',data.holidayAddress||'');
    setField('holidayPhone',data.holidayPhone||'');
    setField('selfPr',data.selfPr||'');
    setField('additionalNotes',data.additionalNotes||'');
    setField('favoriteSubjects',data.favoriteSubjects||'');
    setField('healthStatus',data.healthStatus||'');
    setField('extracurricular',data.extracurricular||'');
    setField('hobbies',data.hobbies||'');
    setField('sports',data.sports||'');
    const im=q('#cv-photo'), ph=q('#photo-placeholder');
    if (safe(data.photoDataUri).startsWith('data:image/')) {im.src=data.photoDataUri; im.hidden=false;ph.hidden=true;}
    else {im.removeAttribute('src');im.hidden=true;ph.hidden=false;}
    currentWarnings=[...putHistory(data.education||[],data.work||data.workExperience||[]),...putCertifications(data.certifications||[])];
    requestAnimationFrame(()=>{currentWarnings=[...new Set([...currentWarnings,...checkOverflow()])];});
    return {warnings:[...currentWarnings]};
  }
  window.renderTronRirekisho=render;
  window.tronRirekishoWarnings=()=>[...currentWarnings];
  // Default: faithful blank reference. Preview synthetic data using ?demo=1 (never real user data).
  if(new URLSearchParams(location.search).get('demo')==='1'){
    render({asOf:'2026-11-07', nameJa:'サンプル　タロウ',furigana:'さんぷる　たろう',dateOfBirth:'2001-04-05',
      nationality:'', postalCode:'160-0000',addressText:'東京都新宿区架空町1-2-3',phone:'03-0000-0000',mobile:'080-0000-0000',email:'sample@example.test',
      education:[{schoolName:'サンプル高等学校',startYear:2017,startMonth:4,endYear:2020,endMonth:3,status:'graduated'},
        {schoolName:'サンプル専門学校',startYear:2020,startMonth:4,endYear:2022,endMonth:3,status:'graduated'}],
      certifications:[{year:2023,month:7,name:'サンプル資格'}],
      selfPr:'私は、課題を整理し、原因を検証しながら解決まで取り組みます。Javaとデータベースの学習を通じて、改善を継続する姿勢を身につけました。',
      favoriteSubjects:'情報処理',healthStatus:'良好',hobbies:'読書',extracurricular:'学校での共同制作',sports:'水泳'});
  } else render({asOf:''});
})();
