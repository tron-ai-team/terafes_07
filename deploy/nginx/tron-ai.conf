# TRON AI — SPA + API same-origin site for traonai.tech
# Install as a NEW site; do not overwrite existing project vhosts.
#
#   sudo cp deploy/nginx/tron-ai.conf /etc/nginx/sites-available/tron-ai.conf
#   sudo ln -sfn /etc/nginx/sites-available/tron-ai.conf /etc/nginx/sites-enabled/tron-ai.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare Tunnel should point traonai.tech at http://127.0.0.1:80
# (or the existing Nginx listener). Do not expose MySQL, Gotenberg, or Ollama.
#
# Do NOT enable this file until DNS/Cloudflare cutover is approved.

upstream tron_ai_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name traonai.tech www.traonai.tech;

    root /var/www/tron-ai;
    index index.html;

    client_max_body_size 15m;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot API + OAuth callback + WebSocket desktop agent
    location /api/ {
        proxy_pass http://tron_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://tron_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /actuator/ {
        proxy_pass http://tron_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /login/ {
        proxy_pass http://tron_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /oauth2/ {
        proxy_pass http://tron_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /ws/ {
        proxy_pass http://tron_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ~ /\. {
        deny all;
    }
}
