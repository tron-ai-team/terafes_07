# ==============================================================================
# TRON AI — Spring Boot Backend
# application.yml  (base / production-safe defaults)
# ==============================================================================
# DO NOT put real secrets here. Use environment variables or application-local.yml.
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Honor Cloudflare and Nginx X-Forwarded-* headers.
  forward-headers-strategy: framework

spring:
  application:
    name: tron-ai-spring

  # ── Database (MySQL 8) ─────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:tron_ai}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:tronai}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2

  # ── JPA / Hibernate (ddl-auto=validate; Flyway owns schema) ─────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  # ── Flyway Database Migrations ──────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ── Jackson / JSON ──────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null

  # ── File Upload / Multipart Configuration ──────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
      enabled: true

  # ── RabbitMQ (Mega Mission 2) ──────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000ms

# ── Spring Boot Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# ── Ollama / AI Configuration ────────────────────────────────────────────────
ollama:
  base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  model: ${OLLAMA_MODEL:qwen3:8b}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
  num-ctx: ${OLLAMA_NUM_CTX:4096}

# ── TRON Model Management (Step 4) ───────────────────────────────────────────
tron:
  default-model: ${TRON_DEFAULT_MODEL:qwen3-8b}
  public-api-url: ${TRON_PUBLIC_API_URL:http://localhost:8080}
  # CV PDF conversion — Gotenberg v8 (local Docker only; never public demos)
  pdf:
    engine: ${TRON_PDF_ENGINE:gotenberg}
    allow-local-libre-office-fallback: ${TRON_PDF_ALLOW_LOCAL_LIBREOFFICE:true}
    gotenberg:
      base-url: ${GOTENBERG_URL:http://localhost:3000}
      connect-timeout-ms: ${GOTENBERG_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GOTENBERG_READ_TIMEOUT_MS:120000}
      max-retries: ${GOTENBERG_MAX_RETRIES:1}
  ai:
    daily-ultra-credits: ${TRON_AI_DAILY_ULTRA_CREDITS:5}
    ultra-enabled: ${TRON_AI_ULTRA_ENABLED:true}
    live-provider-smoke-test: ${TRON_AI_LIVE_PROVIDER_SMOKE_TEST:false}
    groq-api-key: ${GROQ_API_KEY:}
    openrouter-api-key-1: ${OPENROUTER_API_KEY_1:}
    openrouter-api-key-2: ${OPENROUTER_API_KEY_2:}
    mistral-api-key: ${MISTRAL_API_KEY:}
    cloudflare-api-token: ${CLOUDFLARE_API_TOKEN:}
    cloudflare-account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    gemini-api-key-1: ${GEMINI_API_KEY_1:}
    gemini-api-key-2: ${GEMINI_API_KEY_2:}
    gemini-api-key-3: ${GEMINI_API_KEY_3:}
    gemini-api-key-4: ${GEMINI_API_KEY_4:}
    # Documented Groq IDs — change via env without code edits.
    groq-model-fast: ${GROQ_MODEL_FAST:openai/gpt-oss-20b}
    groq-model-smart: ${GROQ_MODEL_SMART:openai/gpt-oss-120b}
    prefer-groq-for-smart: ${TRON_AI_PREFER_GROQ_SMART:true}
    # Personal CV must opt in (request allowCloud=true or enable this flag).
    cv-assist-cloud-enabled: ${TRON_AI_CV_CLOUD_ENABLED:false}
    company-analysis-cloud-enabled: ${TRON_AI_COMPANY_CLOUD_ENABLED:true}
    interview-cloud-enabled: ${TRON_AI_INTERVIEW_CLOUD_ENABLED:true}
  research:
    company-advisor-enabled: ${TRON_RESEARCH_COMPANY_ADVISOR:true}
    max-search-results: ${TRON_RESEARCH_MAX_RESULTS:5}
    max-extract-chars: ${TRON_RESEARCH_MAX_CHARS:4000}
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
      search-depth: ${TAVILY_SEARCH_DEPTH:basic}
    firecrawl:
      api-key: ${FIRECRAWL_API_KEY:}
      base-url: ${FIRECRAWL_BASE_URL:https://api.firecrawl.dev}
  rabbitmq:
    # Default on for local/dev. Production compose sets TRON_RABBITMQ_ENABLED=false.
    enabled: ${TRON_RABBITMQ_ENABLED:true}
  secrets:
    infisical:
      # Disabled by default — local/dev must not require Infisical Cloud.
      enabled: ${INFISICAL_ENABLED:false}
      site-url: ${INFISICAL_SITE_URL:https://app.infisical.com}
      client-id: ${INFISICAL_CLIENT_ID:}
      client-secret: ${INFISICAL_CLIENT_SECRET:}
      project-id: ${INFISICAL_PROJECT_ID:}
      environment: ${INFISICAL_ENV:development}
      secret-path: ${INFISICAL_SECRET_PATH:/}
  # V4 hybrid routing / supervisor / agent engines
  hybrid:
    ollama-health-url: ${TRON_OLLAMA_HEALTH_URL:http://127.0.0.1:11434/api/tags}
    rtx-probe-timeout-ms: ${TRON_RTX_PROBE_TIMEOUT_MS:1500}
  # Voice intelligence (does not affect AI Chat routing).
  voice:
    cloud-prefer-smart: ${TRON_VOICE_CLOUD_PREFER_SMART:true}
    max-tokens-fast: ${TRON_VOICE_MAX_TOKENS_FAST:256}
    max-tokens-quality: ${TRON_VOICE_MAX_TOKENS_QUALITY:512}
    max-history-messages: ${TRON_VOICE_MAX_HISTORY:24}
  supervisor:
    local-model: ${TRON_SUPERVISOR_LOCAL_MODEL:qwen3:8b}
  agent:
    opencode:
      # V4-C: Spring must NOT call Core localhost OpenCode. Execution is via desktop WSS.
      # Legacy keys retained only for migration notes; OpenCodeAgentEngine ignores them.
      base-url: ${TRON_OPENCODE_BASE_URL:}
      password: ${TRON_OPENCODE_PASSWORD:}
      reject-core-workspace: true
    openclaw:
      enabled: ${TRON_OPENCLAW_ENABLED:true}
      gateway-url: ${TRON_OPENCLAW_GATEWAY_URL:}
      gateway-token: ${TRON_OPENCLAW_GATEWAY_TOKEN:}

# ── Desktop agent control plane ───────────────────────────────────────────────
desktop-agent:
  protocol-version: "1.0"
  pairing-ttl-seconds: ${DESKTOP_AGENT_PAIRING_TTL:600}
  heartbeat-timeout-seconds: ${DESKTOP_AGENT_HEARTBEAT_TIMEOUT:45}
  max-actions-per-task: ${DESKTOP_AGENT_MAX_ACTIONS:50}
  action-timeout-seconds: ${DESKTOP_AGENT_ACTION_TIMEOUT:180}
  approval-ttl-seconds: ${DESKTOP_AGENT_APPROVAL_TTL:300}
  max-file-bytes: ${DESKTOP_AGENT_MAX_FILE_BYTES:1048576}

# ── Speech-to-Text (local Whisper worker + Groq Whisper cloud) ───────────────
stt:
  base-url: ${STT_BASE_URL:http://127.0.0.1:8091}
  timeout-seconds: ${STT_TIMEOUT_SECONDS:30}
  prefer-local: ${STT_PREFER_LOCAL:true}
  groq-enabled: ${STT_GROQ_ENABLED:true}
  groq-model: ${STT_GROQ_MODEL:whisper-large-v3-turbo}
  groq-timeout-seconds: ${STT_GROQ_TIMEOUT_SECONDS:60}

# ── Text-to-Speech (Gemini Algenib primary + ElevenLabs/Groq/VOICEVOX fallbacks) ────
tts:
  multilingual:
    base-url: ${MULTILINGUAL_TTS_BASE_URL:}
    timeout-seconds: ${MULTILINGUAL_TTS_TIMEOUT_SECONDS:30}
  # Approved primary voice: Gemini Algenib robotic (EN + JA). Requires GEMINI_API_KEY.
  gemini:
    enabled: ${TTS_GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:${GEMINI_API_KEY_1:}}
    model: ${TTS_GEMINI_MODEL:gemini-3.8-flash-lite-tts}
    voice: ${TTS_GEMINI_VOICE:Algenib}
    style: "${TTS_GEMINI_STYLE:Low, resonant pitch; calm cinematic AI with subtle synthetic resonance, crisp diction and natural conversational pacing.}"
    sample-rate: ${TTS_GEMINI_SAMPLE_RATE:24000}
    stream: ${TTS_GEMINI_STREAM:true}
    timeout-seconds: ${TTS_GEMINI_TIMEOUT_SECONDS:45}
    max-input-chars: ${TTS_GEMINI_MAX_INPUT_CHARS:1200}
    failure-cooldown-seconds: ${TTS_GEMINI_FAILURE_COOLDOWN_SECONDS:30}
  # Fallback bilingual robotic voice (EN + JA). Requires ELEVENLABS_API_KEY.
  elevenlabs:
    enabled: ${TTS_ELEVENLABS_ENABLED:false}
    api-key: ${ELEVENLABS_API_KEY:}
    # Adam premade — free API plans cannot use community/library voices.
    voice-id: ${TTS_ELEVENLABS_VOICE_ID:pNInz6obpgDQGcFmaJgB}
    model-id: ${TTS_ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
    output-format: ${TTS_ELEVENLABS_OUTPUT_FORMAT:pcm_24000}
    timeout-seconds: ${TTS_ELEVENLABS_TIMEOUT_SECONDS:45}
    max-input-chars: ${TTS_ELEVENLABS_MAX_INPUT_CHARS:1200}
    stability: ${TTS_ELEVENLABS_STABILITY:0.55}
    similarity-boost: ${TTS_ELEVENLABS_SIMILARITY:0.75}
    style: ${TTS_ELEVENLABS_STYLE:0.15}
    use-speaker-boost: ${TTS_ELEVENLABS_SPEAKER_BOOST:true}
  # Groq Orpheus: English (and Arabic) only — NOT Japanese.
  groq:
    enabled: ${TTS_GROQ_ENABLED:true}
    model-english: ${TTS_GROQ_MODEL_ENGLISH:canopylabs/orpheus-v1-english}
    voice-english: ${TTS_GROQ_VOICE_ENGLISH:troy}
    timeout-seconds: ${TTS_GROQ_TIMEOUT_SECONDS:30}
    max-input-chars: ${TTS_GROQ_MAX_INPUT_CHARS:200}
  # Subtle TRON robotic coloration applied to server WAV (not browser speech).
  robotic:
    enabled: ${TTS_ROBOTIC_ENABLED:true}
    resonance: ${TTS_ROBOTIC_RESONANCE:0.18}
    metallic: ${TTS_ROBOTIC_METALLIC:0.08}

voicevox:
  base-url: ${VOICEVOX_BASE_URL:http://127.0.0.1:50021}
  speaker-id: ${VOICEVOX_SPEAKER_ID:13}
  timeout-seconds: ${VOICEVOX_TIMEOUT_SECONDS:30}
  audio-ttl-seconds: ${VOICE_AUDIO_TTL_SECONDS:600}
  max-stored-clips: ${MAX_STORED_VOICE_CLIPS:20}


# ── Career Job Finder (CP-04) ─────────────────────────────────────────────────
career:
  jobs:
    mynavi:
      enabled: ${CAREER_JOBS_MYNAVI_ENABLED:true}
    careermap:
      enabled: ${CAREER_JOBS_CAREERMAP_ENABLED:true}
      oauth-enabled: ${CAREER_JOBS_CAREERMAP_OAUTH:false}
      max-fetches-per-search: ${CAREER_JOBS_CAREERMAP_MAX_FETCHES:40}
      fetch-delay-ms: ${CAREER_JOBS_CAREERMAP_DELAY_MS:250}

# ── Springdoc / OpenAPI ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

# ── Security & JWT (Mega Mission 2) ──────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:tron-ai-development-only-secret-key-must-be-at-least-256-bits-long-32-bytes}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh-days: ${JWT_REFRESH_DAYS:7}

cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}

# ── Frontend & Public Core URL ────────────────────────────────────────────────
frontend:
  url: ${TRON_FRONTEND_URL:http://localhost:5174}

# ── OAuth2 / Google Sign-In (Environment Variables Only) ──────────────────────
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# ── Desktop Agent Distribution ────────────────────────────────────────────────
desktop-download:
  windows-url: ${TRON_DESKTOP_DOWNLOAD_WINDOWS_URL:}

# Cloud fallback is off unless CLOUD_AI_ENABLED=true. Never put a real key here.
cloud:
  ai:
    enabled: ${CLOUD_AI_ENABLED:false}
    provider: ${CLOUD_AI_PROVIDER:}
    api-key: ${CLOUD_AI_API_KEY:}
    base-url: ${CLOUD_AI_BASE_URL:}
    model-fast: ${CLOUD_AI_MODEL_FAST:}
    model-quality: ${CLOUD_AI_MODEL_QUALITY:}

# ── MinIO Object Storage (Mega Mission 2) ────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:tron-ai-private}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.tronai: DEBUG
