# Production profile. Every secret comes from the environment.
# Start with: --spring.profiles.active=prod
# In Docker, SERVER_ADDRESS=0.0.0.0 and Nginx on the host is the public entry.

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:tron_ai}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 10000
  jpa:
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:false}
        missing-queues-fatal: false

ollama:
  base-url: ${OLLAMA_BASE_URL}
  model: ${OLLAMA_MODEL:qwen3:8b}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}

stt:
  base-url: ${STT_BASE_URL:}
  timeout-seconds: ${STT_TIMEOUT_SECONDS:30}

voicevox:
  base-url: ${VOICEVOX_BASE_URL:}
  speaker-id: ${VOICEVOX_SPEAKER_ID:13}
  timeout-seconds: ${VOICEVOX_TIMEOUT_SECONDS:30}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:tron-ai-private}

jwt:
  secret: ${JWT_SECRET}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh-days: ${JWT_REFRESH_DAYS:7}

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

frontend:
  url: ${TRON_FRONTEND_URL}

tron:
  public-api-url: ${TRON_PUBLIC_API_URL}
  storage:
    local:
      path: ${TRON_STORAGE_LOCAL_PATH:/var/lib/tron-ai/object-storage}
  pdf:
    engine: ${TRON_PDF_ENGINE:gotenberg}
    allow-local-libre-office-fallback: ${TRON_PDF_ALLOW_LOCAL_LIBREOFFICE:false}
    gotenberg:
      base-url: ${GOTENBERG_URL:http://gotenberg:3000}
      connect-timeout-ms: ${GOTENBERG_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GOTENBERG_READ_TIMEOUT_MS:120000}
      max-retries: ${GOTENBERG_MAX_RETRIES:1}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

cloud:
  ai:
    enabled: ${CLOUD_AI_ENABLED:false}
    provider: ${CLOUD_AI_PROVIDER:}
    api-key: ${CLOUD_AI_API_KEY:}
    base-url: ${CLOUD_AI_BASE_URL:}
    model-fast: ${CLOUD_AI_MODEL_FAST:}
    model-quality: ${CLOUD_AI_MODEL_QUALITY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.tronai: INFO
  file:
    name: ${TRON_LOG_FILE:/var/log/tron-ai/application.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
