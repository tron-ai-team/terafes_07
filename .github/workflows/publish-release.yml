# Manual GHCR publication — no SSH / no Ubuntu deploy.
# Use this after CI is green and before first manual server pull.
#
# Tag policy:
# - Always publishes immutable sha-<12> tags from the checked-out ref.
# - production / latest are ONLY published from an explicitly confirmed
#   workflow_dispatch on refs/heads/main (approved main-branch release).
# - Feature branches must never overwrite production or latest.
name: Publish production image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish-ghcr to confirm"
        required: true
        default: ""
      ref_label:
        description: "Optional extra tag (e.g. beta-1). Never use production/latest. Mutable production tags require main."
        required: false
        default: ""

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: tron-ai-backend

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual publish
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish-ghcr" ]; then
            echo "Manual GHCR publish requires confirm=publish-ghcr"
            exit 1
          fi
          REF_LABEL="${{ github.event.inputs.ref_label }}"
          case "${REF_LABEL}" in
            production|latest)
              echo "ref_label may not be 'production' or 'latest' (reserved mutable tags)."
              exit 1
              ;;
          esac

  test:
    needs: [guard]
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push GHCR
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.sha_image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          BASE="ghcr.io/${REPO_LC}/${IMAGE_NAME}"
          IS_MAIN_RELEASE=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            IS_MAIN_RELEASE=true
          fi

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${BASE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_main_release=${IS_MAIN_RELEASE}" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${BASE}:${SHA_TAG}"
            if [ "${IS_MAIN_RELEASE}" = "true" ]; then
              echo "${BASE}:production"
              echo "${BASE}:latest"
            else
              echo "Non-main ref ${GITHUB_REF}: publishing immutable SHA tag only (skipping production/latest)." >&2
            fi
            if [ -n "${{ github.event.inputs.ref_label }}" ]; then
              echo "${BASE}:${{ github.event.inputs.ref_label }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend/backend-spring
          file: backend/backend-spring/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=tron-ai-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend production build artifact
        working-directory: frontend
        env:
          VITE_CORE_API_URL: ""
          VITE_LEGACY_API_URL: ""
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          tar -czf "$GITHUB_WORKSPACE/frontend-dist.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-tgz
          path: frontend-dist.tar.gz
          retention-days: 30
      - name: Summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.sha_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Ref: \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.meta.outputs.is_main_release }}" = "true" ]; then
            echo "Mutable tags: \`production\`, \`latest\` (main-branch release)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mutable tags: skipped (feature/non-main publish — SHA tag only)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "SSH auto-deploy was NOT run. Pull this tag on Ubuntu manually." >> "$GITHUB_STEP_SUMMARY"
