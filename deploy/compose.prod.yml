# TRON AI — production compose for the Ubuntu core server.
# Does NOT create MySQL, Nginx, Cloudflare, or Ollama.
# Reuses the host MySQL (separate schema) and existing Nginx + tunnel.
#
# Usage (on Ubuntu, from /opt/tron-ai/deploy):
#   docker compose --env-file /etc/tron-ai/tron-ai.env -f compose.prod.yml pull
#   docker compose --env-file /etc/tron-ai/tron-ai.env -f compose.prod.yml up -d
#
# Never publish Gotenberg or MySQL to 0.0.0.0.


services:
  backend:
    image: ${TRON_BACKEND_IMAGE:?Use a verified release digest}
    restart: unless-stopped
    env_file:
      - ${TRON_ENV_FILE:?Runtime env path required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      # Connect through the private Unix-socket proxy; no host MySQL bind changes.
      DB_HOST: mysql-proxy
      GOTENBERG_URL: http://gotenberg:3000
      TRON_PDF_ENGINE: gotenberg
      TRON_PDF_ALLOW_LOCAL_LIBREOFFICE: "false"
      TRON_STORAGE_LOCAL_PATH: /var/lib/tron-ai/object-storage
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    ports:
      # Loopback only — Nginx on the host is the public entry.
      - "127.0.0.1:${TRON_BACKEND_HOST_PORT:?Isolated port required}:8080"
    volumes:
      - tron_ai_object_storage:/var/lib/tron-ai/object-storage
      - tron_ai_uploads:/var/lib/tron-ai/uploads
      - tron_ai_logs:/var/log/tron-ai
    networks:
      - tron_ai_internal
    depends_on:
      mysql-proxy:
        condition: service_started
      gotenberg:
        condition: service_healthy
    mem_limit: ${TRON_BACKEND_MEM_LIMIT:-1280m}
    cpus: ${TRON_BACKEND_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gotenberg:
    image: ${TRON_GOTENBERG_IMAGE:?Pin Gotenberg by digest}
    restart: unless-stopped
    # LibreOffice PDF path only — disable Chromium routes to save RAM.
    command:
      - "gotenberg"
      - "--api-timeout=120s"
      - "--libreoffice-restart-after=10"
      - "--libreoffice-max-queue-size=1"
      - "--chromium-disable-routes=true"
    # No host ports: reachable only on tron_ai_internal as http://gotenberg:3000
    networks:
      - tron_ai_internal
    mem_limit: ${TRON_GOTENBERG_MEM_LIMIT:-1024m}
    cpus: ${TRON_GOTENBERG_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Authenticated TCP transport inside this project's bridge only. MySQL stays on loopback.
  mysql-proxy:
    image: ${TRON_MYSQL_PROXY_IMAGE:?Pin socket proxy by digest}
    entrypoint: ["socat"]
    command: ["TCP-LISTEN:3306,fork,reuseaddr", "UNIX-CONNECT:/run/mysqld/mysqld.sock"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    volumes:
      - ${TRON_MYSQL_SOCKET_DIR:-/run/mysqld}:/run/mysqld:ro
    networks:
      - tron_ai_internal
    mem_limit: 32m
    cpus: 0.1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  frontend:
    image: ${TRON_FRONTEND_IMAGE:?Pin frontend Nginx by digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRON_FRONTEND_HOST_PORT:?Isolated frontend port required}:8080"
    volumes:
      - ${TRON_FRONTEND_DIR:?Matched frontend required}:/usr/share/nginx/html:ro
      - ${TRON_NGINX_CONFIG:?Private proxy configuration required}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tron_ai_internal
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  tron_ai_internal:
    driver: bridge

volumes:
  tron_ai_object_storage: {}
  tron_ai_uploads: {}
  tron_ai_logs: {}
