# Manual only. Publication is a separate validated-main workflow.
name: Deploy staging
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: "Successful main Publish approved release run ID"
        required: true
      confirm:
        description: "Type deploy-staging"
        required: true
permissions:
  contents: read
  deployments: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Manual deployment gates
        env:
          CONFIRM: ${{ inputs.confirm }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = refs/heads/main
          test "$CONFIRM" = deploy-staging
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ ]]
      - name: Require configured environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: staging
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT" > "$RUNNER_TEMP/environment.json"
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'environment.json').read_text())
          rules = data.get('protection_rules', [])
          if not any(r['type'] == 'required_reviewers' and r.get('reviewers') and r.get('prevent_self_review') for r in rules):
              raise SystemExit('Environment requires reviewers and prevention of self-review before deployment')
          PY
      - uses: actions/checkout@v4
      - name: Deploy verified matched bundle over pinned SSH
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          RELEASE_RUN: ${{ inputs.release_run }}
          DEPLOY_ENVIRONMENT: staging
        run: bash deploy/scripts/ssh-deploy.sh
