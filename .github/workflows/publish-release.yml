# Publication is independent of server deployment and remains manual.
name: Publish approved release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require approved main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
  test:
    needs: guard
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build approved backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend/backend-spring
          push: true
          tags: ghcr.io/tron-ai-team/terafes_07/tron-ai-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tron-ai-team/terafes_07
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package matched frontend and manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          VITE_CORE_API_URL: ""
          VITE_LEGACY_API_URL: ""
        run: |
          cd frontend
          npm ci
          npm run build
          mkdir ../release-bundle
          tar -czf ../release-bundle/frontend.tar.gz -C dist .
          cd ..
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          digest = os.environ['BACKEND_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          directory = pathlib.Path('release-bundle')
          manifest = dict(repository=os.environ['GITHUB_REPOSITORY'], sha=os.environ['GITHUB_SHA'],
                          image='ghcr.io/tron-ai-team/terafes_07/tron-ai-backend@' + digest,
                          frontend_sha256=hashlib.sha256((directory/'frontend.tar.gz').read_bytes()).hexdigest())
          (directory/'release.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-bundle/
          retention-days: 30
          if-no-files-found: error
