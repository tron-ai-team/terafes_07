name: Backend production release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Connectivity only (no deployment) or retry an enabled release
        type: choice
        options: [connectivity, release]
        default: connectivity

permissions:
  contents: read

concurrency:
  group: backend-production-release
  cancel-in-progress: false

env:
  BACKEND_REPOSITORY: ghcr.io/tron-ai-team/terafes_07/tron-ai-backend

jobs:
  connectivity-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'connectivity'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the current protected main and deployment disabled
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_ENABLED: ${{ vars.TRON_BACKEND_CD_ENABLED }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != 'tron-ai-team/terafes_07' ||
                "$GITHUB_REF" != 'refs/heads/main' || "$REF_PROTECTED" != 'true' ||
                "$RELEASE_ENABLED" != 'false' ]]; then
            echo 'Connectivity requires protected main and TRON_BACKEND_CD_ENABLED=false.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the existing main-only environment before requesting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/scripts/verify-backend-release-target.sh

  connectivity:
    needs: connectivity-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: backend-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require OIDC configuration
        env:
          CLIENT_ID: ${{ secrets.TS_FEDERATED_CLIENT_ID }}
          AUDIENCE: ${{ secrets.TS_FEDERATED_AUDIENCE }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$AUDIENCE" ]]; then
            echo 'Tailscale OIDC client ID and audience must both be configured.' >&2
            exit 1
          fi
      - name: Authenticate to Tailscale with GitHub OIDC
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_FEDERATED_CLIENT_ID }}
          audience: ${{ secrets.TS_FEDERATED_AUDIENCE }}
          tags: tag:tron-backend-ci
          log-mode: quiet
      - name: Verify pinned SSH and forced-command rejection
        env:
          SSH_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
        run: bash deploy/scripts/probe-backend-ssh.sh

  required-checks:
    if: >-
      github.repository == 'tron-ai-team/terafes_07' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) &&
      vars.TRON_BACKEND_CD_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  verify-target:
    needs: required-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Check before an environment job can implicitly create a missing environment.
      - name: Verify the unattended production target
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/scripts/verify-backend-release-target.sh

  publish:
    needs: verify-target
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the production candidate
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag tron-ai-backend:ci backend/backend-spring
      - name: Smoke test the candidate with dedicated MySQL and Gotenberg
        run: python3 deploy/tests/smoke_backend_production.py
      - name: Publish the tested image and capture its digest
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="$BACKEND_REPOSITORY:sha-$GITHUB_SHA"
          docker tag tron-ai-backend:ci "$image"
          docker push "$image" | tee "$DOCKER_CONFIG/push.log"
          digest="$(sed -nE 's/^sha-[0-9a-f]{40}: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' "$DOCKER_CONFIG/push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Published `%s@%s`\n' "$BACKEND_REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest provenance of the tested image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}

  deploy:
    needs: publish
    if: github.ref_protected && vars.TRON_BACKEND_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: backend-production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck the production target before connecting
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/scripts/verify-backend-release-target.sh
      - name: Join the private deployment network
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_FEDERATED_CLIENT_ID }}
          audience: ${{ secrets.TS_FEDERATED_AUDIENCE }}
          tags: tag:tron-backend-ci
      - name: Request digest deployment over pinned OpenSSH
        env:
          SSH_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Missing deploy SSH key}" "${SSH_KNOWN_HOSTS:?Missing SSH host pin}"
          [[ "$SSH_HOST" =~ ^[a-z0-9][a-z0-9.-]+\.ts\.net$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s\n' "$SSH_KEY" > "$scratch/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$scratch/known_hosts"
          ssh -4 -F /dev/null -i "$scratch/key" -T -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null "tron-backend-cd@$SSH_HOST" \
            "deploy $GITHUB_SHA $DIGEST"
